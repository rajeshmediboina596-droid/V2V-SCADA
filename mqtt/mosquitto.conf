# ==============================================================================
# Mosquitto MQTT Broker Configuration for V2V-SCADA Prototype
# ==============================================================================
# This configuration file supports two deployment architectures:
#
# 1. DEMO MODE (Default for laboratory / offline demonstration):
#    - Standard MQTT on port 1883 with anonymous local access enabled.
#    - Allows plug-and-play testing without certificates or passwords.
#
# 2. SECURE PRODUCTION MODE:
#    - TLS-encrypted MQTT on port 8883.
#    - Anonymous connections disabled (allow_anonymous false).
#    - Password-file authenticated (e.g. /mosquitto/config/passwd).
#    - TLS certificates configured for server and CA validation.
# ==============================================================================

# General Settings
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# ------------------------------------------------------------------------------
# 1. DEMO LISTENER (Standard Plaintext - Port 1883)
# ------------------------------------------------------------------------------
listener 1883
allow_anonymous true

# ------------------------------------------------------------------------------
# 2. SECURE TLS LISTENER (Authenticated & Encrypted - Port 8883)
# Uncomment the block below and set allow_anonymous to false for secure mode:
# ------------------------------------------------------------------------------
# listener 8883
# allow_anonymous false
# password_file /mosquitto/config/passwd
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
# tls_version tlsv1.2
