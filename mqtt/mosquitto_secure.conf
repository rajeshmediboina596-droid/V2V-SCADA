# ==============================================================================
# Mosquitto MQTT Broker Configuration - SECURE PRODUCTION / BENCH MODE
# ==============================================================================
# Enforces:
# - No anonymous connections (allow_anonymous false)
# - TLS 1.2+ encryption on port 8883
# - Password file authentication
# - Role-based Access Control Lists (ACL)
# ==============================================================================

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ------------------------------------------------------------------------------
# Security Controls
# ------------------------------------------------------------------------------
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/mosquitto.acl

# ------------------------------------------------------------------------------
# Secure TLS Listener (Port 8883)
# ------------------------------------------------------------------------------
listener 8883
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
tls_version tlsv1.2
require_certificate false
